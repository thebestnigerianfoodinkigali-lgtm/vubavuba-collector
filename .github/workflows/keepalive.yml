# GitHub disables scheduled workflows after 60 days without repository
# activity. A collector nobody commits to would silently stop scraping — and
# the first symptom would be the kitchen missing Vubavuba orders. One tiny
# commit a month keeps the schedule alive.
name: keepalive

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name "keepalive"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive: monthly commit so the collect schedule is not auto-disabled"
          git push
